<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>對聯對對碰｜漫遊古城</title>
<style>
:root{color-scheme:light;--ink:#363f36;--red:#a13d32;--green:#465f50;--line:#c8b99b}*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:"Microsoft JhengHei",sans-serif;background:#ede8d9 url('assets/images/map.png') center/cover fixed}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:3px solid #a13d32;outline-offset:3px}.page{max-width:1440px;margin:auto;padding:20px 32px}header{text-align:center;position:relative}.eyebrow{font-size:12px;letter-spacing:5px;margin:0;color:#586a57}.title{height:148px;max-width:540px;margin:0 auto;background:url('assets/images/title.png') center/100% 100% no-repeat;display:grid;place-content:center}h1{font-family:"DFKai-SB","KaiTi",serif;font-size:42px;letter-spacing:7px;margin:0;text-shadow:0 1px #fff}header p{margin:4px 0 16px;font-size:14px}.toolbar{display:flex;align-items:center;gap:18px;padding:12px 18px;background:#f9f5e9ed;border:1px solid var(--line);border-radius:8px;margin-bottom:18px}.progress{flex:1;height:7px;background:#ded8c6;border-radius:10px;overflow:hidden}.progress span{display:block;background:var(--green);height:100%;width:0;transition:width .4s}.restart,.primary{border:1px solid var(--green);background:var(--green);color:#fff8e8;padding:9px 16px;border-radius:5px}.layout{display:grid;grid-template-columns:minmax(350px, .9fr) minmax(0,1.5fr);gap:24px}.section-head{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 10px}h2{font-size:18px;margin:0;font-weight:700;letter-spacing:2px}.section-head span{font-size:12px;color:#626956}.destinations{display:grid;gap:9px}.target{position:relative;background:#faf7eded;border:1px solid var(--line);border-radius:8px;min-height:104px;padding:9px 12px;transition:.15s}.target-head{width:100%;display:flex;align-items:center;gap:12px;text-align:left;border:0;background:none;padding:0;min-height:76px}.target img{width:78px;height:76px;object-fit:contain;mix-blend-mode:multiply;border-radius:4px}.target h3{font-family:"DFKai-SB",serif;font-size:23px;margin:0 0 5px}.target small{font-size:12px;color:#767260}.count{margin-left:auto;border:1px solid #c6b699;border-radius:20px;padding:4px 10px;font-size:12px;white-space:nowrap}.target.over{border:2px solid var(--red);background:#fff4d9;transform:scale(1.015)}.matched:empty{display:none}.matched{display:grid;gap:5px}.receipt{position:relative;margin:4px 0;padding:7px 42px 7px 10px;border-top:1px dashed #c8b99b;font-family:"DFKai-SB",serif;font-size:16px;line-height:1.6}.receipt small{display:block;font-family:"Microsoft JhengHei",sans-serif;font-size:11px;color:#686958}.stamp{position:absolute;right:0;top:10px;border:2px solid var(--red);color:var(--red);font-family:"DFKai-SB",serif;font-weight:bold;font-size:16px;padding:3px;transform:rotate(-13deg);animation:stamp .25s ease-out}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{position:relative;min-height:131px;border:0;background:#faf4e4 url('assets/images/scroll.png') center/100% 100%;padding:27px 21px 24px;touch-action:none;user-select:none;font-family:"DFKai-SB","KaiTi",serif;font-size:21px;line-height:1.7;letter-spacing:1px;box-shadow:0 3px 8px #604f3020;border-radius:8px;transition:box-shadow .2s}.card:hover{box-shadow:0 5px 15px #604f3045}.card span{display:block}.card.selected{outline:3px solid var(--red);outline-offset:2px}.card.dragging{opacity:.25}.ghost{position:fixed;pointer-events:none;z-index:1000;opacity:.95;margin:0;transform:rotate(-3deg);box-shadow:0 10px 30px #0003}.card.wrong{animation:shake .35s}#status{position:sticky;bottom:12px;z-index:5;margin:18px auto 0;padding:12px 18px;max-width:780px;background:#fffaf0;border:1px solid var(--line);border-radius:8px;text-align:center;box-shadow:0 3px 12px #0001;font-size:14px;min-height:45px}#status.error{color:#962f26;border-color:#962f26}footer{text-align:center;font-size:12px;line-height:1.8;color:#565f52;margin:18px}dialog{border:1px solid #b5a17c;border-radius:12px;background:#fbf5e6;color:var(--ink);max-width:440px;width:90%;text-align:center;padding:35px}dialog::backdrop{background:#24382cc4}dialog h2{font-family:"DFKai-SB",serif;font-size:34px}.seal{display:inline-block;border:3px double var(--red);color:var(--red);padding:10px;font-size:30px;font-family:"DFKai-SB",serif;transform:rotate(-8deg);margin-bottom:20px}dialog p{line-height:1.8}dialog button{margin:5px}#review{background:none;border:1px solid #9d947d;padding:9px 16px;border-radius:5px}@keyframes shake{25%,75%{transform:translateX(-6px)}50%{transform:translateX(6px)}}@keyframes stamp{from{transform:scale(2) rotate(-13deg);opacity:0}to{transform:scale(1) rotate(-13deg);opacity:1}}@media(min-width:900px){.left{align-self:start}.right{align-self:start}}@media(max-width:760px){.page{padding:12px}.title{height:110px;max-width:380px}h1{font-size:30px;letter-spacing:3px}.eyebrow{font-size:10px}header p{font-size:12px}.toolbar{gap:9px;padding:10px;font-size:13px}.restart{padding:8px}.layout{grid-template-columns:minmax(120px,.85fr) minmax(0,1.25fr);gap:10px}.cards{grid-template-columns:1fr;gap:10px}.section-head{display:block;min-height:44px}h2{font-size:16px}.section-head span{font-size:10px}.left{position:sticky;top:8px;align-self:start}.target{padding:6px;min-height:76px}.target-head{min-height:61px;gap:5px;flex-wrap:wrap}.target img{width:39px;height:42px}.target h3{font-size:18px;margin:0}.target small{display:none}.count{font-size:10px;padding:2px 5px;margin-left:0}.target-head>div{flex:1}.target .matched{display:none}.card{font-size:clamp(15px,4vw,20px);padding:24px 12px;min-height:116px;letter-spacing:0}.receipt{font-size:13px}#status{font-size:12px;padding:9px;bottom:8px}.completed .left{position:static}.completed .target .matched{display:block}.completed .layout{grid-template-columns:1fr}.completed .right{display:none}.completed .target small{display:block}.completed .target img{width:55px;height:55px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
body:not(.completed) .receipt{font-size:0;position:absolute;right:12px;top:64px;margin:0;padding:0;border:0}body:not(.completed) .receipt small{display:none}body:not(.completed) .receipt .stamp{font-size:12px;top:0;right:0;padding:1px}body:not(.completed) .receipt:nth-child(2) .stamp{right:35px}@media(min-width:761px){.left{position:sticky;top:10px}}@media(max-width:760px){body:not(.completed) .target .matched{display:block}body:not(.completed) .receipt{top:51px;right:8px}body:not(.completed) .receipt .stamp{font-size:10px}} @media(min-width:761px) and (max-height:900px){.page{padding-top:8px}.title{height:100px;max-width:400px}h1{font-size:34px}.target{min-height:73px;padding:6px 10px}.target-head{min-height:60px}.target img{width:54px;height:54px}.destinations{gap:6px}.target h3{font-size:21px}body:not(.completed) .receipt{top:43px}.card{min-height:112px;padding:19px 20px;font-size:20px}}@media(max-width:760px){.target img{width:32px;height:38px}.target h3{font-size:16px;white-space:nowrap}.target-head{gap:3px}.count{font-size:9px;padding:2px 4px}.title{mix-blend-mode:multiply}} </style>
</head>
<body><a class="adventure-map-link" href="../對聯大冒險地圖/index.html">回到大地圖</a><style>.adventure-map-link{position:fixed;left:max(10px,env(safe-area-inset-left));top:max(10px,env(safe-area-inset-top));z-index:9999;padding:9px 13px;border:1px solid #6d5231;border-radius:7px;background:#f5e7c8ee;color:#3a2818;text-decoration:none;font-weight:800;box-shadow:0 3px 12px #0004}.adventure-map-link:focus-visible{outline:3px solid #a13d32;outline-offset:2px}@media(max-width:760px){.adventure-map-link{font-size:12px;padding:7px 9px}}</style><main class="page"><header><p class="eyebrow">漫遊古城 · 生活中的語文</p><div class="title"><h1>對聯對對碰</h1></div><p>一副對聯，一份心意。替十二幅卷軸找到合適的去處。</p></header>
<div class="toolbar"><strong id="score">已配對 0 / 12</strong><div class="progress" role="progressbar" aria-label="配對進度" aria-valuemin="0" aria-valuemax="12" aria-valuenow="0"><span></span></div><button class="restart" id="restart">重新開始</button></div>
<div class="layout"><section class="left"><div class="section-head"><h2>六處人家</h2><span>每處收集 2 副對聯</span></div><div class="destinations" id="targets"></div></section><section class="right"><div class="section-head"><h2>待送卷軸</h2><span>拖曳，或點卷軸再點分類</span></div><div class="cards" id="cards"></div></section></div>
<div id="status" role="status" aria-live="polite">讀懂情境，把右側卷軸送到左側對應項目。</div><footer>上行為上聯，下行為下聯。配對成功後可查看辨識線索。<br>電腦與手機皆可拖曳；鍵盤可用 Tab 選取、Enter 配對。</footer></main>
<dialog id="win" aria-labelledby="win-title"><div class="seal">過關</div><h2 id="win-title">十二幅卷軸，各得其所！</h2><p id="result"></p><button class="primary" id="again">再玩一次</button><button id="review">欣賞對聯</button></dialog>
<script>
const categories=[['wedding','婚嫁','佳偶締結良緣'],['hospital','醫院','仁心守護安康'],['barber','理髮店','巧手整理儀容'],['home','喬遷','新居迎來新景'],['mourning','輓男喪','追念逝者風範'],['birthday','祝壽','祝願福壽綿長']];
// 題庫含常見聯語與教學改寫；不附會作者。可在此修改上下聯與提示。
const poems=[
['wedding','百年恩愛雙心結','千里姻緣一線牽','「姻緣」「雙心」祝福新人成婚。'],
['wedding','琴瑟和鳴成美眷','鸞鳳比翼結良緣','「琴瑟和鳴」「鸞鳳」比喻夫妻和諧。'],
['hospital','但願世間人無病','何妨架上藥生塵','寧願藥品無人取用，也盼大家健康。'],
['hospital','學貫中西，活人無算','術精內外，濟世良多','「中西」「內外」寫醫學與醫術；活人指救人。'],
['barber','雖是毫髮生意','卻是頂上功夫','「毫髮」「頂上」點出整理頭髮的技藝。'],
['barber','進店來蓬頭垢面','出門去容光煥發','進出店前後的儀容變化，是理髮店的線索。'],
['home','鶯遷喬木聲聲喜','燕入新居事事興','「鶯遷」「新居」都是搬入新家的線索。'],
['home','新居迎百福','吉地納千祥','「新居」「吉地」祝賀遷入新家。'],
['mourning','泰山頹，風範永存','梁木壞，典型長在','「泰山頹」「梁木壞」常用於悼念男性長者。'],
['mourning','哲人已逝音容杳','遺德猶存惠澤長','悼念男性長者，追思他的容貌聲音與德行。'],
['birthday','福如東海長流水','壽比南山不老松','以長流水、不老松祝福長壽。'],
['birthday','天增歲月人增壽','春滿乾坤福滿門','「增壽」「福滿門」祝福壽星；也常見於春聯。']
].map((p,i)=>({id:'p'+i,category:p[0],top:p[1],bottom:p[2],hint:p[3]}));
const $=s=>document.querySelector(s);let selected=null,solved=new Set(),mistakes=0,drag=null,suppressClick=false;
function say(text,error=false){$('#status').textContent=text;$('#status').classList.toggle('error',error)}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function clearSelection(){document.querySelectorAll('.selected').forEach(c=>{c.classList.remove('selected');c.setAttribute('aria-pressed','false')});selected=null}
function choose(id){if(solved.has(id))return;clearSelection();selected=id;const c=document.getElementById(id);c.classList.add('selected');c.setAttribute('aria-pressed','true');say('已選取卷軸，請點選左側分類。')}
function match(id,category){if(!id||solved.has(id))return;const p=poems.find(p=>p.id===id),card=document.getElementById(id);if(p.category!==category){mistakes++;say('還差一點！這副對聯不適合此情境，請留意關鍵詞再試一次。',true);card.classList.remove('wrong');void card.offsetWidth;card.classList.add('wrong');clearSelection();return}solved.add(id);clearSelection();card.remove();const target=document.querySelector(`[data-category="${category}"]`);const receipt=document.createElement('div');receipt.className='receipt';receipt.innerHTML=`${p.top}<br>${p.bottom}<small>${p.hint}</small><span class="stamp" aria-label="答對，已鎖定">正解</span>`;target.querySelector('.matched').append(receipt);let count=poems.filter(x=>x.category===category&&solved.has(x.id)).length;target.querySelector('.count').textContent=count+' / 2';$('#score').textContent=`已配對 ${solved.size} / 12`;$('.progress span').style.width=(solved.size/12*100)+'%';$('.progress').setAttribute('aria-valuenow',solved.size);say('答對了！'+p.hint);if(solved.size===12){localStorage.setItem('coupletAdventure.v1.seal.couplet','earned');document.body.classList.add('completed');$('#result').textContent=`完成全部 12 副對聯！你已取得「對聯之印」。本次答錯 ${mistakes} 次。`;$('#win').showModal();} }
function cleanup(){if(!drag)return;drag.card.classList.remove('dragging');drag.ghost?.remove();document.querySelectorAll('.over').forEach(e=>e.classList.remove('over'));drag=null}
function start(){cleanup();clearSelection();solved=new Set();mistakes=0;$('#win').close();document.body.classList.remove('completed');$('#targets').innerHTML=categories.map(([id,name,desc])=>`<article class="target" data-category="${id}"><button class="target-head" aria-label="配對至${name}"><img src="assets/images/${id}.png" alt=""><div><h3>${name}</h3><small>${desc}</small></div><span class="count">0 / 2</span></button><div class="matched"></div></article>`).join('');$('#cards').innerHTML=shuffle([...poems]).map(p=>`<button class="card" id="${p.id}" aria-pressed="false" aria-label="${p.top}，${p.bottom}"><span>${p.top}</span><span>${p.bottom}</span></button>`).join('');$('#score').textContent='已配對 0 / 12';$('.progress span').style.width='0%';$('.progress').setAttribute('aria-valuenow','0');say('讀懂情境，把右側卷軸送到左側對應項目。');}
$('#cards').addEventListener('click',e=>{if(suppressClick){suppressClick=false;return}const c=e.target.closest('.card');if(c)choose(c.id)});
$('#targets').addEventListener('click',e=>{const t=e.target.closest('.target');if(!t)return;if(selected)match(selected,t.dataset.category);else say('先選取右側的一副對聯，再點選分類。')});
$('#cards').addEventListener('pointerdown',e=>{const c=e.target.closest('.card');if(!c||e.button!==0||drag)return;suppressClick=false;drag={id:c.id,card:c,pointer:e.pointerId,x:e.clientX,y:e.clientY,moved:false};c.setPointerCapture(e.pointerId)});
window.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.pointer)return;if(!drag.moved&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<7)return;if(!drag.moved){drag.moved=true;const r=drag.card.getBoundingClientRect();drag.ghost=drag.card.cloneNode(true);drag.ghost.removeAttribute('id');drag.ghost.setAttribute('aria-hidden','true');drag.ghost.classList.add('ghost');drag.ghost.style.width=r.width+'px';drag.ghost.style.height=r.height+'px';document.body.append(drag.ghost);drag.card.classList.add('dragging')}e.preventDefault();drag.ghost.style.left=(e.clientX-drag.ghost.offsetWidth/2)+'px';drag.ghost.style.top=(e.clientY-45)+'px';document.querySelectorAll('.over').forEach(t=>t.classList.remove('over'));const t=document.elementFromPoint(e.clientX,e.clientY)?.closest('.target');if(t)t.classList.add('over');},{passive:false});
window.addEventListener('pointerup',e=>{if(!drag||e.pointerId!==drag.pointer)return;const id=drag.id,moved=drag.moved;const t=document.elementFromPoint(e.clientX,e.clientY)?.closest('.target');cleanup();if(moved){suppressClick=true;setTimeout(()=>suppressClick=false,0);if(t)match(id,t.dataset.category);else say('卷軸已退回。請放到左側分類框內。')}});
window.addEventListener('pointercancel',cleanup);window.addEventListener('blur',cleanup);window.addEventListener('keydown',e=>{if(e.key==='Escape'){cleanup();clearSelection()}});
$('#restart').onclick=start;$('#again').onclick=()=>{start();$('#restart').focus();window.scrollTo(0,0)};$('#review').onclick=()=>$('#win').close();start();
</script></body></html>
